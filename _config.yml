timezone:    Europe/London
future:      true

# main text of home
name: Oleksii Oleksenko
title: Oleksii Oleksenko
bio: Computer Science researcher working on hardware security, software security, and everything in between

# twitter summary info
description: Personal website

# if it's an external image, update below for true
# better with square images
external-image: false
picture: assets/images/profile.jpg

# If you want to include your resume, set to true
# and specify source (external or local).
resume: false

url: https://oleksiioleksenko.github.io

permalink: /:title/

# if you don't have any of social below, comment the line
twitter: oleksii_o
github:  OleksiiOleksenko
gscholar: qHCADLcAAAAJ
linkedin: oleksiioleksenko
# email: t-oleksenko at tu-dresden.de

# do you want a larger site? change the option below
# normal = 560px / large = 810px
width: large

# if you don't need "about", comment it out below
about: false

# do you want to show the "read time" of the posts?
read-time: false

# related posts inside a post?
#related: true

# show author block at the end of a post ?
show-author: false

# do you want some animations?
animation: false

plugins:
  - jekyll-seo-tag
  - jekyll-gist
  - jekyll-feed
  - jemoji

jekyll-mentions:
    base_url: https://github.com

compress_html:
    ignore:
        envs:
        - development
        - stage

exclude: ["README.md", "Gemfile", "Gemfile.lock"]
